# L'application SYSI TRAVEL. Supabase tourne à part (dépôt supabase/docker), voir DEPLOIEMENT.md.
#   docker compose up -d --build
services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_GOOGLE_ENABLED: ${VITE_SUPABASE_GOOGLE_ENABLED:-false}
    restart: unless-stopped
    env_file: .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-${VITE_SUPABASE_URL}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY}}
    # Seulement en local : Nginx est la seule porte d'entrée publique.
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
