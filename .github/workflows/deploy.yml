# Vérifie chaque pull request, et met en ligne chaque push sur main (https://sysitravel.com).
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   VPS_HOST         IP du VPS (2.24.51.140)
#   VPS_USER         utilisateur de déploiement sur le VPS (deploy)
#   VPS_SSH_KEY      clé privée SSH de cet utilisateur (contenu complet du fichier)
#   VPS_KNOWN_HOSTS  empreinte du serveur : sortie de `ssh-keyscan -t ed25519 2.24.51.140`
# Le serveur garde sa propre configuration dans /opt/sysi-travel/.env (voir DEPLOIEMENT.md).

name: CI et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deployer:
    name: Mise en ligne
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sysitravel.com
    # Un seul déploiement à la fois ; un push arrivé entre-temps attend son tour.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config

      - name: Envoyer le code sur le VPS
        run: rsync -az --delete --exclude-from=deploy/rsync-exclude ./ vps:/opt/sysi-travel/app/

      - name: Construire et redémarrer le site
        run: ssh vps "bash /opt/sysi-travel/app/deploy/deploy.sh ${{ github.sha }}"

      - name: Vérifier le site public
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://sysitravel.com/api/health; then exit 0; fi
            sleep 6
          done
          echo "https://sysitravel.com/api/health ne répond pas" && exit 1
