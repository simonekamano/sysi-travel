# Nginx sur le VPS, version finale avec HTTPS : à copier tel quel dans
# /etc/nginx/sites-available/sysi-travel une fois le certificat obtenu (voir MIGRATION-VPS.md).
#   sysitravel.com          -> application SYSI TRAVEL (127.0.0.1:3000)
#   www.sysitravel.com      -> redirection vers https://sysitravel.com
#   api.sysitravel.com      -> Supabase / Kong (127.0.0.1:8000), Studio protégé par mot de passe
# Certificat Let's Encrypt « sysitravel.com » (les trois noms), créé par
#   certbot --nginx --redirect -d sysitravel.com -d www.sysitravel.com -d api.sysitravel.com
# Toujours vérifier avec « nginx -t » avant « systemctl reload nginx ».

# Ce fichier est inclus dans le bloc http de Nginx : les zones de limitation se déclarent ici.
# Pages et formulaires du site : 30 requêtes par seconde par adresse IP (rafales de 100 tolérées).
# Les fichiers (images, scripts, polices) ne sont pas limités : une page en charge des dizaines,
# et en Guinée beaucoup de visiteurs mobiles partagent la même adresse IP.
limit_req_zone $binary_remote_addr zone=sysi_site:10m rate=30r/s;
# API Supabase : 30 requêtes par seconde par adresse IP.
limit_req_zone $binary_remote_addr zone=sysi_api:10m rate=30r/s;
# Connexion, inscription, mot de passe oublié, codes : 10 par minute par adresse IP (rafales de
# 10), contre le forçage des mots de passe.
limit_req_zone $binary_remote_addr zone=sysi_auth:10m rate=10r/m;
limit_req_status 429;

# --- HTTP : tout part vers HTTPS (certbot renouvelle le certificat par ici) -----------------------

server {
    listen 80;
    listen [::]:80;
    server_name sysitravel.com api.sysitravel.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.sysitravel.com;
    server_tokens off;
    return 301 https://sysitravel.com$request_uri;
}

# --- www.sysitravel.com : redirection -------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sysitravel.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sysitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysitravel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sysitravel.com$request_uri;
}

# --- sysitravel.com : le site ---------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sysitravel.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sysitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysitravel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    # Une requête lente ou incomplète ne bloque pas le serveur.
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Fichiers du site : pas de limite (voir plus haut).
    location ~ ^/(assets|images|brand|fonts)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=sysi_site burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- api.sysitravel.com : Supabase ----------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sysitravel.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sysitravel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysitravel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Envoi depuis l'administration : photos (10 Mo) et PDF des livres (bucket « livres », 50 Mo).
    client_max_body_size 55m;

    # En-têtes de sécurité de l'API (Kong n'en ajoute pas).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connexion, inscription, mot de passe oublié, codes : limités contre le forçage.
    location ~ ^/auth/v1/(signup|token|recover|otp|verify|resend|factors) {
        limit_req zone=sysi_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos publiques (stockage) : pas de limite, une page de la boutique en charge beaucoup.
    location /storage/v1/object/public/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=sysi_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime (websockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
