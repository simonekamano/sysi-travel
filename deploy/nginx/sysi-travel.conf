# Nginx sur le VPS (/etc/nginx/sites-available/sysi-travel), avant HTTPS.
#   sysitravel.com          -> application SYSI TRAVEL (127.0.0.1:3000)
#   www.sysitravel.com      -> redirection vers sysitravel.com
#   api.sysitravel.com      -> Supabase / Kong (127.0.0.1:8000), Studio protégé par mot de passe
# Ensuite, certbot ajoute HTTPS et la redirection HTTP -> HTTPS :
#   certbot --nginx --redirect -d sysitravel.com -d www.sysitravel.com -d api.sysitravel.com

server {
    listen 80;
    listen [::]:80;
    server_name www.sysitravel.com;
    return 301 $scheme://sysitravel.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sysitravel.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sysitravel.com;

    # Envoi depuis l'administration : photos (10 Mo) et PDF des livres (bucket « livres », 50 Mo).
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime (websockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
