# Nginx sur le VPS : deux domaines en HTTPS (certificats via certbot --nginx).
#   votre-domaine.com      -> application SYSI TRAVEL (127.0.0.1:3000)
#   api.votre-domaine.com  -> Supabase / Kong (127.0.0.1:8000)
# Remplacer votre-domaine.com partout, copier dans /etc/nginx/sites-available/, activer, puis :
#   sudo certbot --nginx -d votre-domaine.com -d www.votre-domaine.com -d api.votre-domaine.com

server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.votre-domaine.com;

    # Envoi des photos depuis l'administration (limite du bucket : 10 Mo).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Realtime (websockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
